name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      # Boot the real server and hit it once, so a broken start script fails CI.
      - name: Server smoke test
        run: |
          DB_FILE=:memory: PORT=3000 npm start &
          for i in $(seq 1 20); do curl -fs localhost:3000/api/health && break; sleep 0.5; done
          curl -fs "localhost:3000/api/dashboard?date=2026-01-01" > /dev/null
          curl -fs localhost:3000/ | grep -q "<title>Steady"

      - name: Build browser demo
        run: npm run build:demo
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  pages:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
